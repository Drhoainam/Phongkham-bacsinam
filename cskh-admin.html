<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Quản trị CSKH — BS. Hoài Nam</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--su:#fff;--bo:#dde1e8;--ac:#0284c7;--acl:#e0f2fe;--gr:#059669;--grl:#d1fae5;--am:#d97706;--aml:#fef3c7;--da:#dc2626;--dal:#fee2e2;--tx:#111827;--tx2:#4b5563;--tx3:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{background:var(--su);border-bottom:1px solid var(--bo);padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header b{color:var(--ac);font-size:1.05rem}
.tabs{display:flex;gap:4px;padding:12px 18px 0;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 14px;border-radius:8px 8px 0 0;font-weight:600;color:var(--tx2);cursor:pointer;position:relative}
.tabs button.on{background:var(--su);color:var(--ac)}
.tabs .n{background:var(--da);color:#fff;border-radius:99px;padding:0 7px;font-size:.72rem;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:0 18px 40px}
.panel{background:var(--su);border-radius:0 10px 10px 10px;padding:16px;min-height:300px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;font-size:.85rem}
.btn.gr{background:var(--gr)}.btn.red{background:var(--dal);color:var(--da)}.btn.line{background:#fff;border:1.5px solid var(--bo);color:var(--tx2)}.btn.ghost{background:var(--acl);color:var(--ac)}
.btn:disabled{opacity:.5}
.flt{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.flt button{border:1.5px solid var(--bo);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.82rem}
.flt button.on{border-color:var(--ac);background:var(--acl);color:var(--ac);font-weight:600}
.it{border:1px solid var(--bo);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.muted{color:var(--tx2)}.tiny{color:var(--tx3);font-size:.78rem}
.badge{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600}
.b-pending,.b-open{background:var(--aml);color:var(--am)}.b-confirmed,.b-answered{background:var(--grl);color:var(--gr)}.b-cancelled,.b-rejected{background:var(--dal);color:var(--da)}.b-done{background:#e5e7eb;color:var(--tx2)}
.in{width:100%;border:1.5px solid var(--bo);border-radius:8px;padding:8px 10px;outline:none}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:110px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs img{width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--bo);cursor:zoom-in}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login .c{background:#fff;padding:40px;border-radius:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi div{border:1px solid var(--bo);border-radius:10px;padding:12px}.kpi b{font-size:1.4rem;display:block}
.stars{color:#f59e0b;letter-spacing:1px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--bo);text-align:left;font-size:.85rem}
.empty{text-align:center;color:var(--tx3);padding:40px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:99}.toast.show{opacity:1}
pre.log{background:#0f172a;color:#cbd5e1;padding:12px;border-radius:8px;max-height:260px;overflow:auto;font-size:.78rem;white-space:pre-wrap;margin-top:10px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#lightbox img{max-width:95vw;max-height:95vh}
</style>
</head>
<body>
<div id="scrLogin" class="login hidden"><div class="c"><h2 style="margin-bottom:6px">Quản trị CSKH</h2><p class="muted" style="margin-bottom:20px">Đăng nhập bằng tài khoản Google của bác sĩ</p><button class="btn" onclick="login()">Đăng nhập Google</button><p class="tiny" id="loginErr" style="margin-top:12px;color:var(--da)"></p></div></div>

<div id="scrApp" class="hidden">
<header><b>🩺 CSKH — BS. Hoài Nam</b><div><span class="tiny" id="who"></span> <button class="btn ghost" id="bellBtn" onclick="enableBell()" style="display:none">🔔 Bật chuông báo lịch mới</button> <button class="btn line" onclick="reloadAll()">🔄</button> <button class="btn line" onclick="logout()">Đăng xuất</button></div></header>
<div class="tabs" id="tabs"></div>
<main><div class="panel" id="panel"></div></main>
</div>
<div class="toast" id="toast"></div>
<div id="lightbox" class="hidden" onclick="this.classList.add('hidden')"><img id="lbImg"></div>

<script type="module">
const ADMIN_EMAIL='bsnam115@gmail.com';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";
const app=initializeApp({apiKey:"AIzaSyDkWWIZaV8hJpu0Yhls6e3szBMYuiuXb6M",authDomain:"phongkham-bacsinam.firebaseapp.com",projectId:"phongkham-bacsinam",storageBucket:"phongkham-bacsinam.firebasestorage.app",messagingSenderId:"187579047275",appId:"1:187579047275:web:c0e30e60a91cbdda82402e"});
const auth=getAuth(app), db=getFirestore(app);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const tsMs=t=>t?.toMillis?t.toMillis():(t?.seconds?t.seconds*1000:(typeof t==='number'?t:0));
const fdt=t=>tsMs(t)?new Date(tsMs(t)).toLocaleString('vi-VN'):'—';
function fd(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return s||'—'; const d=new Date(+m[1],+m[2]-1,+m[3]); return `${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]} ${m[3]}/${m[2]}/${m[1]}`; }
function toE164(raw){ let d=String(raw||'').replace(/\D/g,''); if(d.startsWith('84')) d=d.slice(2); else if(d.startsWith('0')) d=d.slice(1); return (d.length>=9&&d.length<=10)?'+84'+d:null; }
const lp=e=>e?'0'+String(e).replace('+84',''):'';
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
window.zoom=u=>{ $('lbImg').src=u; $('lightbox').classList.remove('hidden'); };

const S={tab:'appts',appts:[],consults:[],feedback:[],af:'pending',cf:'open',editing:null}; window.S=S;
window.login=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('loginErr').textContent=e.message);
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  if(u&&u.email===ADMIN_EMAIL){ $('scrLogin').classList.add('hidden'); $('scrApp').classList.remove('hidden'); $('who').textContent=u.email; await reloadAll(); }
  else{ if(u){ $('loginErr').textContent='Tài khoản '+(u.email||u.phoneNumber)+' không có quyền quản trị.'; await signOut(auth); } $('scrApp').classList.add('hidden'); $('scrLogin').classList.remove('hidden'); }
});

window.reloadAll=async()=>{
  $('panel').innerHTML='<div class="empty">Đang tải...</div>';
  const get=async c=>(await getDocs(collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
  try{ [S.appts,S.consults,S.feedback]=await Promise.all([get('appointments'),get('consults'),get('feedback')]); }
  catch(e){ $('panel').innerHTML=`<div class="empty">Lỗi tải dữ liệu: ${esc(e.code||e.message)}<br>Kiểm tra lại Firestore Rules đã deploy chưa.</div>`; return; }
  S.appts.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  S.consults.sort((a,b)=>tsMs(b.createdAt)-tsMs(a.createdAt));
  S.feedback.sort((a,b)=>tsMs(b.createdAt)-tsMs(a.createdAt));
  render();
};
window.tab=t=>{ S.tab=t; render(); };
window.render=()=>render();
function render(){
  const np=S.appts.filter(a=>a.status==='pending').length, nc=S.consults.filter(c=>c.status==='open').length;
  $('tabs').innerHTML=[['appts','📅 Lịch hẹn',np],['consults','📷 Tư vấn ảnh',nc],['feedback','⭐ Đánh giá',0],['sync','🔁 Đồng bộ hồ sơ BN',0]]
    .map(([k,l,n])=>`<button class="${S.tab===k?'on':''}" onclick="tab('${k}')">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('');
  $('panel').innerHTML=({appts:vAppts,consults:vConsults,feedback:vFeedback,sync:vSync})[S.tab]();
}
const contact=(name,phone)=>`<b>${esc(name)}</b> · <a href="tel:${esc(lp(phone))}">${esc(lp(phone))}</a> · <a href="https://zalo.me/${esc(lp(phone))}" target="_blank" rel="noopener">Zalo</a>`;

/* ---------- Lịch hẹn ---------- */
const AST={pending:'Chờ xác nhận',confirmed:'Đã xác nhận',reschedule:'Chờ BN đồng ý giờ mới',done:'Đã khám',cancelled:'BN huỷ',rejected:'PK từ chối/huỷ'};
const REASONS={
  rejected:['Bác sĩ có việc đột xuất vào thời gian này, mong anh/chị đặt lại ngày khác.',
            'Tình trạng của anh/chị nằm ngoài chuyên khoa của phòng khám. Anh/chị nên đến bệnh viện để được khám và điều trị phù hợp.',
            'Khung giờ này đã kín lịch, mong anh/chị chọn giờ khác.'],
  reschedule:['Bác sĩ về muộn hơn dự kiến, xin phép dời sang giờ mới.',
              'Bác sĩ bận vào ngày này, xin phép dời sang ngày mới.']
};
const CLINIC_NAME='Phòng khám BS. Hoài Nam', APP_LINK='https://phongkham-bacsinam.vercel.app/cskh';
// Khung giờ khám (giống app bệnh nhân): T2–T7 19h–22h, CN 7h–11h
const EVE=['19:00','19:30','20:00','20:30','21:00','21:30'], SUN=['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30'];
const slotsFor=d=>{ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return EVE; return new Date(+m[1],+m[2]-1,+m[3]).getDay()===0?SUN:EVE; };
function vAppts(){
  const today=new Date().toISOString().slice(0,10);
  const list=S.appts.filter(a=>S.af==='all'?true:S.af==='today'?a.date===today:a.status===S.af);
  let h=`<div class="flt">${[['pending','Chờ xác nhận'],['today','Hôm nay'],['confirmed','Đã xác nhận'],['reschedule','Chờ BN đồng ý đổi giờ'],['done','Đã khám'],['cancelled','BN huỷ'],['rejected','PK từ chối/huỷ'],['all','Tất cả']].map(([k,l])=>`<button class="${S.af===k?'on':''}" onclick="af('${k}')">${l}</button>`).join('')}</div>`;
  if(!list.length) return h+'<div class="empty">Không có lịch hẹn.</div>';
  return h+list.map(apptCard).join('');
}
function apptCard(a){
  const open=S.editing&&S.editing.id===a.id;
  let acts='';
  if(['pending','confirmed','reschedule'].includes(a.status) && !open){
    acts=`<div class="acts">
      ${a.status==='pending'?`<button class="btn gr" onclick="setAppt('${a.id}','confirmed')">✓ Xác nhận</button>`:''}
      ${a.status==='confirmed'?`<button class="btn" onclick="setAppt('${a.id}','done')">Đã khám</button>`:''}
      <button class="btn ghost" onclick="openEdit('${a.id}','reschedule')">🕑 Đổi giờ</button>
      <button class="btn red" onclick="openEdit('${a.id}','rejected')">✕ ${a.status==='pending'?'Từ chối':'Huỷ lịch'}</button></div>`;
  }
  if(open){
    const k=S.editing.kind;
    acts=`<div style="margin-top:10px;border-top:1px dashed var(--bo);padding-top:10px">
      <b>${k==='reschedule'?'🕑 Đề xuất giờ mới cho khách':'✕ '+(a.status==='pending'?'Từ chối':'Huỷ')+' lịch — lý do gửi khách'}</b>
      ${k==='reschedule'?`<div style="margin-top:10px"><div class="tiny" style="font-weight:600;color:var(--tx2)">① Ngày mới</div>
        <input type="date" class="in" id="nd_${a.id}" value="${esc(S.editing.d||a.date)}" style="width:auto;margin-top:4px" onchange="S.editing.d=this.value;S.editing.t='';render()">
        <div class="tiny" style="font-weight:600;color:var(--tx2);margin-top:10px">② Bấm chọn giờ mới <span style="color:var(--da)">(bắt buộc)</span></div>
        <div class="acts" style="margin-top:4px">${slotsFor(S.editing.d||a.date).map(t=>{ const same=(S.editing.d||a.date)===a.date&&t===a.time; const on=S.editing.t===t;
          return `<button class="btn ${on?'':'line'}" ${same?'disabled title="Giờ hiện tại của khách"':''} onclick="S.editing.t='${t}';render()" style="min-width:70px${on?';background:var(--ac);color:#fff':''}">${t}${same?' (cũ)':''}</button>`; }).join('')}
          <input type="time" class="in" id="nt_${a.id}" value="${esc(S.editing.t||'')}" onchange="S.editing.t=this.value;render()" style="width:auto" title="Giờ khác"></div>
        <div class="tiny" style="font-weight:600;color:var(--tx2);margin-top:10px">③ Lý do gửi khách</div></div>`:''}
      <div class="acts">${REASONS[k].map((r,i)=>`<button class="btn line" onclick="pickReason('${a.id}','${k}',${i})" style="text-align:left;font-weight:500">${esc(r.length>60?r.slice(0,58)+'…':r)}</button>`).join('')}</div>
      <textarea class="in" id="rs_${a.id}" placeholder="Lý do / lời nhắn cho khách (bắt buộc)" style="min-height:80px;margin-top:8px" oninput="S.editing.note=this.value">${esc(S.editing.note||'')}</textarea>
      ${k==='reschedule'&&S.editing.t?`<div style="margin-top:8px;font-weight:600;color:var(--gr)">→ Đề xuất: ${fd(S.editing.d||a.date)} · ${S.editing.t}</div>`:''}
      <div class="err" id="er_${a.id}" style="color:var(--da);font-weight:600;margin-top:8px">${esc(S.editing.err||'')}</div>
      <div class="acts"><button class="btn ${k==='reschedule'?'':'red'}" style="${k==='reschedule'?'':'background:var(--da);color:#fff'}" onclick="saveEdit('${a.id}')">${k==='reschedule'?'Gửi đề xuất giờ mới':'Xác nhận '+(a.status==='pending'?'từ chối':'huỷ lịch')}</button><button class="btn line" onclick="S.editing=null;render()">Thôi</button></div></div>`;
  }
  const notify = (['rejected','reschedule'].includes(a.status)&&a.adminNote) ? `<div class="acts"><button class="btn ghost" onclick="notifyZalo('${a.id}')">💬 Chép tin & mở Zalo khách</button><span class="tiny" style="align-self:center">Khách cũng thấy thông báo khi mở app</span></div>` : '';
  return `<div class="it"><div class="row"><div><b style="font-size:1rem">${fd(a.date)} · ${esc(a.time)}</b> — ${esc(a.service)}<div>${contact(a.name,a.phone)}</div>
    ${a.note?`<div class="muted">Ghi chú BN: ${esc(a.note)}</div>`:''}
    ${a.status==='reschedule'?`<div style="color:var(--am);font-weight:600">→ Đề xuất: ${fd(a.proposedDate)} · ${esc(a.proposedTime)}</div>`:''}
    ${a.adminNote?`<div class="tiny">PK đã nhắn: ${esc(a.adminNote)}</div>`:''}<div class="tiny">Đặt lúc ${fdt(a.createdAt)}${a.ptId?' · có hồ sơ':' · BN mới'}${a.acceptedAt?' · BN đã đồng ý giờ mới':''}</div></div>
    <span class="badge b-${a.status==='reschedule'?'pending':a.status}">${AST[a.status]||a.status}</span></div>${acts}${notify}</div>`;
}
window.af=k=>{ S.af=k; S.editing=null; render(); };
window.openEdit=(id,kind)=>{ const a=S.appts.find(x=>x.id===id); S.editing={id,kind,d:a.date,t:'',note:'',err:''}; render(); };
window.pickReason=(id,k,i)=>{ $('rs_'+id).value=REASONS[k][i]; S.editing.note=REASONS[k][i]; };
window.setAppt=async(id,status)=>{
  try{ const upd={status,updatedAt:serverTimestamp()};
    await updateDoc(doc(db,'appointments',id),upd); Object.assign(S.appts.find(x=>x.id===id),upd); toast('Đã cập nhật'); render(); if(status==='confirmed') callNotify('appt',id); }
  catch(e){ toast('Lỗi: '+(e.code||e.message)); }
};
window.saveEdit=async id=>{
  const a=S.appts.find(x=>x.id===id), k=S.editing.kind, note=$('rs_'+id).value.trim(); S.editing.note=note;
  const fail=m=>{ S.editing.err='⚠️ '+m; render(); toast(m); };
  if(k==='reschedule' && !S.editing.t) return fail('Anh chưa bấm chọn GIỜ MỚI ở bước ②');
  if(!note) return fail('Vui lòng ghi lý do để khách biết');
  const upd={status:k,adminNote:note,updatedAt:serverTimestamp(),prevStatus:a.status};
  if(k==='reschedule'){ const d=S.editing.d||a.date, t=S.editing.t;
    if(d===a.date&&t===a.time) return fail('Giờ mới đang trùng giờ cũ ('+t+'), hãy chọn giờ khác');
    upd.proposedDate=d; upd.proposedTime=t; }
  try{ await updateDoc(doc(db,'appointments',id),upd); Object.assign(a,upd); S.editing=null; render(); callNotify('appt',id);
    toast(k==='reschedule'?'Đã gửi đề xuất giờ mới':'Đã '+(upd.prevStatus==='pending'?'từ chối':'huỷ')+' lịch');
    if(confirm('Đã gửi thông báo vào app của khách (máy khách sẽ báo chuông nếu đã bật thông báo).\nNhắn thêm qua Zalo cho chắc? (tin nhắn soạn sẵn, anh chỉ cần dán và gửi)')) notifyZalo(id);
  }catch(e){ toast('Lỗi: '+(e.code||e.message)); }
};
function apptMsg(a){
  const when=`${fd(a.date)} lúc ${a.time}`;
  if(a.status==='reschedule') return `${CLINIC_NAME} xin thông báo: lịch khám ${when} của anh/chị ${a.name} cần dời sang ${fd(a.proposedDate)} lúc ${a.proposedTime}.\nLý do: ${a.adminNote}\nAnh/chị vui lòng mở app để bấm "Đồng ý giờ mới" hoặc chọn giờ khác: ${APP_LINK}`;
  return `${CLINIC_NAME} xin thông báo: lịch khám ${when} của anh/chị ${a.name} ${a.prevStatus==='confirmed'?'đã bị huỷ':'chưa thể tiếp nhận'}.\nLý do: ${a.adminNote}\nXin lỗi anh/chị vì sự bất tiện. Đặt lịch khác tại: ${APP_LINK}`;
}
window.notifyZalo=async id=>{
  const a=S.appts.find(x=>x.id===id); const msg=apptMsg(a);
  try{ await navigator.clipboard.writeText(msg); toast('Đã chép tin nhắn — dán (Ctrl+V) vào Zalo rồi gửi'); }catch(e){ prompt('Chép tin nhắn này:',msg); }
  window.open('https://zalo.me/'+lp(a.phone),'_blank');
};

/* ---------- Tư vấn ---------- */
function vConsults(){
  const list=S.consults.filter(c=>S.cf==='all'||c.status===S.cf);
  let h=`<div class="flt">${[['open','Chờ trả lời'],['answered','Đã trả lời'],['all','Tất cả']].map(([k,l])=>`<button class="${S.cf===k?'on':''}" onclick="cf('${k}')">${l}</button>`).join('')}</div>`;
  if(!list.length) return h+'<div class="empty">Không có câu hỏi.</div>';
  return h+list.map(c=>`<div class="it"><div class="row"><div>${contact(c.name||'(chưa có hồ sơ)',c.phone)}<div class="tiny">${fdt(c.createdAt)} · Vị trí: ${esc(c.area||'—')} · Thời gian bị: ${esc(c.duration||'—')}</div></div><span class="badge b-${c.status}">${c.status==='answered'?'Đã trả lời':'Chờ trả lời'}</span></div>
    <div style="margin-top:8px;white-space:pre-wrap">${esc(c.desc)}</div>
    ${(c.images||[]).length?`<div class="thumbs">${c.images.map(u=>`<img src="${esc(u)}" loading="lazy" onclick="zoom(this.src)">`).join('')}</div>`:'<div class="tiny">(không có ảnh)</div>'}
    <textarea class="in" id="rp_${c.id}" placeholder="Trả lời bệnh nhân...">${esc(c.reply||'')}</textarea>
    <div class="acts"><button class="btn gr" onclick="reply('${c.id}')">${c.status==='answered'?'Cập nhật trả lời':'Gửi trả lời'}</button>
    <button class="btn line" onclick="tpl('${c.id}','visit')">+ Mẫu: mời khám</button><button class="btn line" onclick="tpl('${c.id}','photo')">+ Mẫu: xin ảnh rõ hơn</button></div>
    ${c.repliedAt?`<div class="tiny">Trả lời lúc ${fdt(c.repliedAt)}</div>`:''}</div>`).join('');
}
window.cf=k=>{ S.cf=k; render(); };
const TPL={visit:'\n\nĐể chẩn đoán chính xác, anh/chị nên đến khám trực tiếp. Anh/chị có thể đặt lịch ngay trong mục "Đặt lịch" của ứng dụng.',photo:'\n\nẢnh hiện chưa đủ rõ. Anh/chị vui lòng chụp lại dưới ánh sáng tự nhiên, gồm 1 ảnh toàn cảnh và 1–2 ảnh cận cảnh tổn thương, rồi gửi câu hỏi mới.'};
window.tpl=(id,k)=>{ const t=$('rp_'+id); t.value=(t.value.trim()+TPL[k]).trim(); t.focus(); };
window.reply=async id=>{
  const r=$('rp_'+id).value.trim(); if(!r){ toast('Chưa nhập nội dung'); return; }
  try{ const upd={reply:r,status:'answered',repliedAt:serverTimestamp()}; await updateDoc(doc(db,'consults',id),upd); callNotify('consult',id);
    Object.assign(S.consults.find(x=>x.id===id),upd,{repliedAt:Date.now()}); toast('Đã gửi trả lời'); render(); }
  catch(e){ toast('Lỗi: '+(e.code||e.message)); }
};

/* ---------- Đánh giá ---------- */
function vFeedback(){
  const f=S.feedback; if(!f.length) return '<div class="empty">Chưa có đánh giá.</div>';
  const avg=f.reduce((s,x)=>s+(x.stars||0),0)/f.length; const low=f.filter(x=>x.stars<=3).length;
  const d30=Date.now()-30*864e5; const f30=f.filter(x=>tsMs(x.createdAt)>=d30);
  return `<div class="kpi"><div><span class="tiny">Điểm trung bình</span><b>${avg.toFixed(2)} ★</b></div><div><span class="tiny">Tổng lượt</span><b>${f.length}</b></div><div><span class="tiny">30 ngày qua</span><b>${f30.length}</b></div><div><span class="tiny">≤ 3 sao (cần xem)</span><b style="color:var(--da)">${low}</b></div></div>
  <table><tr><th>Thời gian</th><th>Bệnh nhân</th><th>Sao</th><th>Góp ý</th></tr>${f.map(x=>`<tr style="${x.stars<=3?'background:#fff7ed':''}"><td>${fdt(x.createdAt)}</td><td>${contact(x.name,x.phone)}</td><td class="stars">${'★'.repeat(x.stars||0)}</td><td>${esc(x.comment||'')}</td></tr>`).join('')}</table>`;
}

/* ---------- Đồng bộ hồ sơ BN -> portal ---------- */
function buildProfile(p){
  const visits=(p.visits||[]).map(v=>({id:String(v.id),date:v.date||'',type:v.type||'',diag:v.diag||'',
    meds:(v.meds||[]).filter(m=>m&&m.name).map(m=>({name:m.name,dose:m.dose||'',unit:m.unit||'',qty:m.qty||'',times:m.times||'',days:m.days||'',note:m.note||'',remark:m.remark||''})),
    procs:(v.procs||[]).filter(x=>x&&x.name).map(x=>({name:x.name,qty:x.qty||1})),note:v.note||'',nextVisit:v.nextVisit||'',nextVisitTime:v.nextVisitTime||''}));
  const last=visits[visits.length-1];
  return {ptId:p.id,name:p.name||'',year:p.year||'',gender:p.gender||'',nextVisit:p.nextVisit||last?.nextVisit||'',nextVisitTime:p.nextVisitTime||last?.nextVisitTime||'',visits};
}
function vSync(){
  return `<p>Bệnh nhân chỉ xem được đơn thuốc/lịch sử khám sau khi hồ sơ được <b>đồng bộ sang cổng bệnh nhân</b> (collection <code>portal</code>, mỗi SĐT một bản ghi, chỉ chứa thông tin lâm sàng cần thiết — không có chi phí, vốn, kho).</p>
  <p class="muted" style="margin-top:6px">Nếu anh đã gắn bản vá vào app phòng khám thì mỗi lần lưu hồ sơ sẽ tự đồng bộ. Nút dưới đây đồng bộ lại <b>toàn bộ</b> — dùng lần đầu và khi đổi SĐT bệnh nhân.</p>
  <div class="acts"><button class="btn" id="syncBtn" onclick="syncAll()">🔁 Đồng bộ toàn bộ hồ sơ</button></div><pre class="log hidden" id="syncLog"></pre>`;
}
window.syncAll=async()=>{
  const btn=$('syncBtn'), log=$('syncLog'); btn.disabled=true; log.classList.remove('hidden'); log.textContent='Đang đọc hồ sơ bệnh nhân...\n';
  try{
    const pts=(await getDocs(collection(db,'patients'))).docs.map(d=>({id:d.id,...d.data()}));
    const groups={}; let noPhone=0;
    pts.forEach(p=>{ const e=toE164(p.phone); if(!e){ noPhone++; return; } (groups[e]=groups[e]||[]).push(p); });
    const keys=Object.keys(groups); log.textContent+=`${pts.length} hồ sơ · ${keys.length} số điện thoại hợp lệ · ${noPhone} hồ sơ thiếu/sai SĐT\n`;
    let ok=0, fail=0;
    for(const e of keys){
      try{ await setDoc(doc(db,'portal',e),{phone:e,profiles:groups[e].map(buildProfile),updatedAt:serverTimestamp()}); ok++; }
      catch(err){ fail++; log.textContent+=`✗ ${lp(e)}: ${err.code||err.message}\n`; }
      if(ok%20===0) log.textContent+=`... ${ok}/${keys.length}\n`;
    }
    log.textContent+=`\nXONG: ${ok} cổng BN đã cập nhật${fail?`, ${fail} lỗi`:''}.`;
    if(noPhone) log.textContent+=`\nHồ sơ thiếu SĐT: ${pts.filter(p=>!toE164(p.phone)).map(p=>p.name).slice(0,50).join(', ')}`;
  }catch(e){ log.textContent+='Lỗi: '+(e.code||e.message); }
  btn.disabled=false;
};

async function saveBell(test){
  const reg=await navigator.serviceWorker.register('/sw-cskh.js',{scope:'/cskh'}); await navigator.serviceWorker.ready;
  const token=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
  await setDoc(doc(db,'pushTokens',auth.currentUser.uid),{tokens:arrayUnion(token),role:'admin',updatedAt:serverTimestamp()},{merge:true});
  localStorage.setItem('bellToken',token); $('bellBtn').style.display='none';

window.enableBell=async()=>{
  try{ const p=await Notification.requestPermission(); if(p!=='granted'){ toast('Trình duyệt đang chặn thông báo'); return; }
    await saveBell(true); toast('🔔 Đã bật — vài giây nữa máy sẽ báo một chuông thử'); }
  catch(e){ toast('Lỗi bật chuông: '+(e.code||e.message)); }
};
onAuthStateChanged(auth, async u=>{
  if(!u||u.email!==ADMIN_EMAIL) return;
  if(!(await isSupported().catch(()=>false))||!('Notification' in window)) return;
  if(Notification.permission==='granted' && localStorage.getItem('bellToken')) saveBell(false).catch(()=>{});
  else $('bellBtn').style.display='';
});
