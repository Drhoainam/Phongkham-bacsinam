<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhòngKhám Pro — Quản lý bệnh nhân</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDkWWIZaV8hJpu0Yhls6e3szBMYuiuXb6M",
    authDomain: "phongkham-bacsinam.firebaseapp.com",
    projectId: "phongkham-bacsinam",
    storageBucket: "phongkham-bacsinam.firebasestorage.app",
    messagingSenderId: "187579047275",
    appId: "1:187579047275:web:c0e30e60a91cbdda82402e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose to global
  window.__db = db;
  window.__fbReady = true;
  window.__col = (name) => collection(db, name);
  window.__doc = (col, id) => doc(db, col, id);
  window.__setDoc = setDoc;
  window.__getDocs = getDocs;
  window.__deleteDoc = deleteDoc;
  window.__onSnapshot = onSnapshot;
  window.__query = query;
  window.__orderBy = orderBy;

  // Notify app Firebase is ready
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #2ea043;
    --accent2: #58a6ff;
    --accent3: #f0883e;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --danger: #f85149;
    --radius: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* SYNC STATUS */
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); display: inline-block; margin-right: 6px; transition: background 0.3s; }
  .sync-dot.syncing { background: var(--accent3); animation: pulse 1s infinite; }
  .sync-dot.synced { background: var(--accent); }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--accent2); display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-info { color: var(--text2); font-size: 0.8rem; }
  .sync-status { font-size: 0.75rem; color: var(--text2); display: flex; align-items: center; }

  .app { display: flex; flex: 1; height: calc(100vh - 60px); }

  .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-search { padding: 16px; border-bottom: 1px solid var(--border); }
  .search-box { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
  .search-box:focus { border-color: var(--accent2); }
  .search-box::placeholder { color: var(--text3); }
  .btn-new-patient { width: 100%; margin-top: 10px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 9px; font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
  .btn-new-patient:hover { opacity: 0.85; }

  .patient-list { overflow-y: auto; flex: 1; padding: 8px; }
  .patient-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; transition: background 0.15s; border: 1px solid transparent; margin-bottom: 4px; }
  .patient-item:hover { background: var(--surface2); }
  .patient-item.active { background: var(--surface2); border-color: var(--accent2); }
  .patient-item-name { font-size: 0.9rem; font-weight: 600; }
  .patient-item-meta { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }
  .patient-badge { display: inline-block; font-size: 0.65rem; padding: 1px 6px; border-radius: 20px; margin-top: 4px; }
  .badge-new { background: rgba(46,160,67,0.2); color: var(--accent); }
  .badge-revisit { background: rgba(88,166,255,0.2); color: var(--accent2); }

  .main { flex: 1; overflow-y: auto; padding: 24px; }

  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 16px; }
  .welcome-icon { font-size: 3rem; opacity: 0.3; }
  .welcome h2 { font-family: 'Playfair Display', serif; color: var(--text2); font-size: 1.4rem; }
  .welcome p { color: var(--text3); font-size: 0.85rem; }

  .patient-detail { max-width: 860px; }
  .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .detail-name { font-family: 'Playfair Display', serif; font-size: 1.6rem; }
  .detail-meta { color: var(--text2); font-size: 0.85rem; margin-top: 4px; display: flex; gap: 16px; flex-wrap: wrap; }

  .btn { border: none; border-radius: var(--radius); padding: 8px 16px; font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--accent2); color: #0d1117; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: rgba(248,81,73,0.15); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }
  .btn-danger:hover { background: rgba(248,81,73,0.25); }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 18px; font-size: 0.85rem; font-weight: 500; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.78rem; color: var(--text2); font-weight: 500; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent2); }
  input::placeholder, textarea::placeholder { color: var(--text3); }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 80px; }

  .med-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .med-table th { text-align: left; color: var(--text3); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .med-table td { padding: 8px 10px; border-bottom: 1px solid rgba(48,54,61,0.5); vertical-align: middle; }
  .med-table tr:last-child td { border-bottom: none; }
  .med-table input, .med-table select { padding: 5px 8px; font-size: 0.8rem; width: 100%; }
  .btn-add-med { background: rgba(46,160,67,0.1); color: var(--accent); border: 1px dashed rgba(46,160,67,0.4); border-radius: 7px; padding: 7px 14px; font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-add-med:hover { background: rgba(46,160,67,0.2); }
  .btn-remove { background: none; border: none; color: var(--danger); cursor: pointer; opacity: 0.6; font-size: 1rem; padding: 2px 6px; }
  .btn-remove:hover { opacity: 1; }

  .visit-timeline { position: relative; padding-left: 24px; }
  .visit-timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .visit-item { position: relative; margin-bottom: 20px; }
  .visit-item::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent2); border: 2px solid var(--bg); }
  .visit-date { font-size: 0.75rem; color: var(--text3); margin-bottom: 6px; }
  .visit-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .visit-diag { font-weight: 600; font-size: 0.9rem; }
  .visit-meds { font-size: 0.78rem; color: var(--text2); margin-top: 6px; }
  .visit-next { font-size: 0.75rem; color: var(--accent3); margin-top: 6px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 420px; width: 90%; box-shadow: var(--shadow); text-align: center; }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 6px; }
  .modal p { color: var(--text2); font-size: 0.82rem; margin-bottom: 24px; }
  #qrcode { display: flex; justify-content: center; margin-bottom: 20px; }
  #qrcode canvas, #qrcode img { border-radius: 10px; padding: 12px; background: white; }
  .qr-info { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-size: 0.8rem; text-align: left; color: var(--text2); margin-bottom: 20px; line-height: 1.8; }
  .qr-info strong { color: var(--text); }

  .modal-np { max-width: 500px; text-align: left; }
  .modal-np h3 { text-align: center; margin-bottom: 20px; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-val { font-size: 1.8rem; font-weight: 700; font-family: 'Playfair Display', serif; }
  .stat-lbl { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }

  .save-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.25s ease; }
  .empty-list { text-align: center; padding: 40px 16px; color: var(--text3); font-size: 0.82rem; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; font-size: 0.82rem; font-weight: 600; z-index: 999; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; animation: fadeIn 0.2s ease; }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* LOADING */
  .loading-bar { height: 2px; background: linear-gradient(90deg, var(--accent2), var(--accent)); position: fixed; top: 60px; left: 0; width: 0%; z-index: 300; transition: width 0.3s; }
  .loading-bar.active { width: 70%; }
  .loading-bar.done { width: 100%; opacity: 0; transition: width 0.2s, opacity 0.3s 0.2s; }
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    PhòngKhám
    <span style="color:var(--text2);font-family:'Be Vietnam Pro';font-weight:300;font-size:1rem"> — Quản lý bệnh nhân</span>
  </div>
  <div class="header-right">
    <div class="sync-status">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Đang kết nối...</span>
    </div>
    <div class="header-info" id="headerDate"></div>
  </div>
</header>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-search">
      <input class="search-box" type="text" id="searchInput" placeholder="🔍  Tìm bệnh nhân..." oninput="filterPatients()">
      <button class="btn-new-patient" onclick="openNewPatient()">＋ Thêm bệnh nhân mới</button>
    </div>
    <div class="patient-list" id="patientList">
      <div class="empty-list">Đang tải dữ liệu...</div>
    </div>
  </div>

  <div class="main" id="mainContent">
    <div class="welcome">
      <div class="welcome-icon">🩺</div>
      <h2>Chào bác sĩ!</h2>
      <p>Đang kết nối Firebase...</p>
    </div>
  </div>
</div>

<!-- MODAL: NEW PATIENT -->
<div class="modal-overlay" id="modalNewPatient">
  <div class="modal modal-np fade-in">
    <h3>Thêm bệnh nhân mới</h3>
    <div class="form-row">
      <div class="form-group"><label>Họ và tên *</label><input type="text" id="np_name" placeholder="Nguyễn Văn A"></div>
      <div class="form-group"><label>Năm sinh</label><input type="number" id="np_year" placeholder="1985"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Giới tính</label><select id="np_gender"><option>Nam</option><option>Nữ</option></select></div>
      <div class="form-group"><label>Số điện thoại</label><input type="text" id="np_phone" placeholder="0912 345 678"></div>
    </div>
    <div class="form-group" style="margin-bottom:12px"><label>Địa chỉ</label><input type="text" id="np_address" placeholder="123 Đường ABC..."></div>
    <div class="form-group" style="margin-bottom:20px"><label>Tiền sử bệnh / Dị ứng thuốc</label><textarea id="np_history" placeholder="VD: Tăng huyết áp, Dị ứng Penicillin..."></textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('modalNewPatient')">Hủy</button>
      <button class="btn btn-primary" onclick="saveNewPatient()">✓ Lưu bệnh nhân</button>
    </div>
  </div>
</div>

<!-- MODAL: QR CODE -->
<div class="modal-overlay" id="modalQR">
  <div class="modal fade-in">
    <h3>📲 Mã QR cho bệnh nhân</h3>
    <p>Bệnh nhân quét mã này để xem đơn thuốc & nhận nhắc nhở</p>
    <div id="qrcode"></div>
    <div class="qr-info" id="qrInfo"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" onclick="closeModal('modalQR')">Đóng</button>
      <button class="btn btn-primary" onclick="printQR()">🖨️ In QR</button>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let patients = [];
let currentPatientId = null;
let currentTab = 'kham';
let firebaseReady = false;

// ============ FIREBASE HELPERS ============
async function fbSavePatient(p) {
  if (!firebaseReady) { saveLocal(); return; }
  try {
    setSyncing();
    const cleanP = JSON.parse(JSON.stringify(p));
    await window.__setDoc(window.__doc('patients', p.id), cleanP);
    setSynced();
  } catch(e) {
    console.error('Firebase save error:', e);
    setError();
    saveLocal();
  }
}

async function fbDeletePatient(id) {
  if (!firebaseReady) return;
  try {
    setSyncing();
    await window.__deleteDoc(window.__doc('patients', id));
    setSynced();
  } catch(e) { setError(); }
}

function saveLocal() {
  localStorage.setItem('pk_patients', JSON.stringify(patients));
}

function save(patient) {
  saveLocal();
  if (patient) fbSavePatient(patient);
}

// ============ SYNC STATUS UI ============
function setSyncing() {
  document.getElementById('syncDot').className = 'sync-dot syncing';
  document.getElementById('syncText').textContent = 'Đang đồng bộ...';
}
function setSynced() {
  document.getElementById('syncDot').className = 'sync-dot synced';
  document.getElementById('syncText').textContent = 'Đã đồng bộ Firebase ✓';
}
function setError() {
  document.getElementById('syncDot').className = 'sync-dot error';
  document.getElementById('syncText').textContent = 'Lưu local (offline)';
}
function setConnected() {
  document.getElementById('syncDot').className = 'sync-dot synced';
  document.getElementById('syncText').textContent = 'Firebase kết nối ✓';
}

// ============ INIT ============
function init() {
  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });

  // Load local first for instant display
  const local = localStorage.getItem('pk_patients');
  if (local) {
    patients = JSON.parse(local);
    renderPatientList();
    updateWelcome();
  }
}

function updateWelcome() {
  const mc = document.getElementById('mainContent');
  if (!currentPatientId) {
    mc.innerHTML = `<div class="welcome"><div class="welcome-icon">🩺</div><h2>Chào bác sĩ!</h2><p>Chọn bệnh nhân bên trái hoặc thêm bệnh nhân mới để bắt đầu.</p></div>`;
  }
}

// Listen for Firebase ready
window.addEventListener('firebase-ready', async () => {
  firebaseReady = true;
  setConnected();

  // Real-time sync: listen to Firestore changes
  const q = window.__query(window.__col('patients'));
  window.__onSnapshot(q, (snapshot) => {
    const fbPatients = [];
    snapshot.forEach(doc => fbPatients.push(doc.data()));

    if (fbPatients.length > 0) {
      // Backup any in-progress form data before overwriting
      const cvBackup = {};
      patients.forEach(p => {
        if (p.currentVisit && (p.currentVisit.meds?.length > 0)) {
          cvBackup[p.id] = JSON.parse(JSON.stringify(p.currentVisit));
        }
      });

      // Firebase is source of truth
      patients = fbPatients.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));

      // Restore in-progress form data
      patients.forEach(p => { if (cvBackup[p.id]) p.currentVisit = cvBackup[p.id]; });

      saveLocal();
      renderPatientList(document.getElementById('searchInput').value);

      // Only re-render detail if user is NOT currently filling the exam form
      const isEditingForm = document.querySelector('#v_diag') !== null;
      if (currentPatientId && !isEditingForm) renderDetail();

      setSynced();
    } else if (patients.length > 0) {
      // First time: push local data to Firebase
      patients.forEach(p => fbSavePatient(p));
    }

    updateWelcome();
  });
});

// ============ PATIENT LIST ============
function renderPatientList(filter = '') {
  const list = document.getElementById('patientList');
  const filtered = patients.filter(p =>
    p.name.toLowerCase().includes(filter.toLowerCase()) ||
    (p.phone && p.phone.includes(filter))
  );
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-list">${filter ? 'Không tìm thấy.' : 'Chưa có bệnh nhân nào.<br>Nhấn "Thêm bệnh nhân mới".'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(p => {
    const isNew = !p.visits || p.visits.length === 0;
    return `<div class="patient-item ${p.id===currentPatientId?'active':''}" onclick="selectPatient('${p.id}')">
      <div class="patient-item-name">${p.name}</div>
      <div class="patient-item-meta">${p.gender||''} · ${p.year?(new Date().getFullYear()-p.year)+' tuổi':''} · ${p.phone||'Chưa có SĐT'}</div>
      <span class="patient-badge ${isNew?'badge-new':'badge-revisit'}">${isNew?'Bệnh nhân mới':'Tái khám'}</span>
    </div>`;
  }).join('');
}

function filterPatients() { renderPatientList(document.getElementById('searchInput').value); }

// ============ SELECT / DETAIL ============
function selectPatient(id) {
  currentPatientId = id; currentTab = 'kham';
  renderPatientList(document.getElementById('searchInput').value);
  renderDetail();
}

function renderDetail() {
  const p = patients.find(x => x.id === currentPatientId);
  if (!p) return;
  const age = p.year ? (new Date().getFullYear()-p.year)+' tuổi' : 'N/A';
  const visitCount = (p.visits||[]).length;
  document.getElementById('mainContent').innerHTML = `
    <div class="patient-detail fade-in">
      <div class="detail-header">
        <div>
          <div class="detail-name">${p.name}</div>
          <div class="detail-meta">
            <span>👤 ${p.gender||'N/A'} · ${age}</span>
            <span>📱 ${p.phone||'Chưa có SĐT'}</span>
            <span>🏠 ${p.address||'N/A'}</span>
          </div>
          ${p.history?`<div style="font-size:0.78rem;color:var(--accent3);margin-top:6px">⚠️ Tiền sử: ${p.history}</div>`:''}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn btn-ghost" onclick="generateQR()">📲 Tạo QR</button>
          <button class="btn btn-danger" onclick="deletePatient('${p.id}')">🗑️ Xóa</button>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" style="color:var(--accent2)">${visitCount}</div><div class="stat-lbl">Lần khám</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--accent);font-size:1rem">${p.nextVisit||'—'}</div><div class="stat-lbl">Lịch tái khám</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--accent3);font-size:1rem">${visitCount>0?p.visits[visitCount-1].date:'—'}</div><div class="stat-lbl">Khám gần nhất</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${currentTab==='kham'?'active':''}" onclick="switchTab('kham',event)">📋 Khám mới & Kê đơn</div>
        <div class="tab ${currentTab==='lichsu'?'active':''}" onclick="switchTab('lichsu',event)">📜 Lịch sử (${visitCount})</div>
      </div>
      <div id="tabContent"></div>
    </div>`;
  renderTab();
}

function switchTab(tab, e) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(e) e.target.classList.add('active');
  renderTab();
}

function renderTab() {
  const p = patients.find(x=>x.id===currentPatientId);
  const tc = document.getElementById('tabContent');
  if(!tc||!p) return;
  if(currentTab==='kham') { tc.innerHTML=renderKhamTab(p); if(!p.currentVisit)p.currentVisit={meds:[]}; if(!p.currentVisit.meds)p.currentVisit.meds=[]; renderMedRows(); }
  else tc.innerHTML=renderLichSuTab(p);
}

function renderKhamTab(p) {
  const cv=p.currentVisit||{};
  return `
    <div class="card">
      <div class="card-title">Thông tin khám hôm nay</div>
      <div class="form-row">
        <div class="form-group"><label>Ngày khám</label><input type="date" id="v_date" value="${cv.date||new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group"><label>Loại khám</label><select id="v_type"><option ${cv.type==='Khám mới'?'selected':''}>Khám mới</option><option ${cv.type==='Tái khám'?'selected':''}>Tái khám</option><option ${cv.type==='Tiểu phẫu'?'selected':''}>Tiểu phẫu</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Mạch (lần/phút)</label><input type="number" id="v_pulse" value="${cv.pulse||''}" placeholder="80"></div>
        <div class="form-group"><label>Huyết áp (mmHg)</label><input type="text" id="v_bp" value="${cv.bp||''}" placeholder="120/80"></div>
      </div>
      <div class="form-row"><div class="form-group full"><label>Lý do khám / Triệu chứng</label><textarea id="v_reason" placeholder="Đau đầu, chóng mặt...">${cv.reason||''}</textarea></div></div>
      <div class="form-row"><div class="form-group full"><label>Chẩn đoán</label><input type="text" id="v_diag" value="${cv.diag||''}" placeholder="VD: Tăng huyết áp độ I..."></div></div>
    </div>
    <div class="card">
      <div class="card-title">Đơn thuốc</div>
      <table class="med-table">
        <thead><tr><th style="width:28%">Tên thuốc</th><th style="width:14%">Hàm lượng</th><th style="width:12%">Lần/ngày</th><th style="width:12%">Số ngày</th><th style="width:22%">Giờ uống (S-T-C)</th><th style="width:5%"></th></tr></thead>
        <tbody id="medRows"></tbody>
      </table>
      <button class="btn-add-med" onclick="addMedRow()">＋ Thêm thuốc</button>
    </div>
    <div class="card">
      <div class="card-title">Lịch hẹn & Dặn dò</div>
      <div class="form-row">
        <div class="form-group"><label>Ngày tái khám</label><input type="date" id="v_next" value="${p.nextVisit||''}"></div>
        <div class="form-group"><label>Giờ hẹn</label><input type="time" id="v_nextTime" value="${p.nextVisitTime||''}"></div>
      </div>
      <div class="form-group"><label>Lời dặn dò</label><textarea id="v_note" placeholder="Nghỉ ngơi, uống đủ nước...">${cv.note||''}</textarea></div>
    </div>
    <div class="save-bar">
      <button class="btn btn-ghost" onclick="clearCurrentVisit()">↺ Xóa form</button>
      <button class="btn btn-primary" onclick="saveVisit()">☁️ Lưu & Đồng bộ</button>
    </div>`;
}

function renderLichSuTab(p) {
  const visits=(p.visits||[]).slice().reverse();
  if(visits.length===0) return '<div class="empty-list" style="padding:60px">Chưa có lần khám nào.</div>';
  return `<div class="visit-timeline">${visits.map(v=>`
    <div class="visit-item">
      <div class="visit-date">${v.date} — ${v.type}</div>
      <div class="visit-card">
        <div class="visit-diag">🩺 ${v.diag||'Chưa ghi chẩn đoán'}</div>
        ${v.bp?`<div style="font-size:0.78rem;color:var(--text2);margin-top:4px">HA: ${v.bp} · Mạch: ${v.pulse}</div>`:''}
        ${v.meds&&v.meds.length>0?`<div class="visit-meds">💊 ${v.meds.map(m=>`${m.name} ${m.dose} ${m.times}x/${m.days}ngày`).join(' | ')}</div>`:''}
        ${v.note?`<div style="font-size:0.78rem;color:var(--text2);margin-top:4px;font-style:italic">📝 ${v.note}</div>`:''}
        ${v.nextVisit?`<div class="visit-next">📅 Tái khám: ${v.nextVisit}${v.nextVisitTime?' lúc '+v.nextVisitTime:''}</div>`:''}
      </div>
    </div>`).join('')}</div>`;
}

// ============ MEDICINE ROWS ============
function renderMedRows() {
  const p=patients.find(x=>x.id===currentPatientId);
  if(!p||!p.currentVisit) return;
  const tbody=document.getElementById('medRows'); if(!tbody) return;
  tbody.innerHTML=(p.currentVisit.meds||[]).map((m,i)=>`
    <tr>
      <td><input type="text" value="${m.name||''}" onchange="updateMed(${i},'name',this.value)" placeholder="Amoxicillin..."></td>
      <td><input type="text" value="${m.dose||''}" onchange="updateMed(${i},'dose',this.value)" placeholder="500mg"></td>
      <td><input type="number" value="${m.times||''}" onchange="updateMed(${i},'times',this.value)" placeholder="3"></td>
      <td><input type="number" value="${m.days||''}" onchange="updateMed(${i},'days',this.value)" placeholder="7"></td>
      <td><input type="text" value="${m.note||''}" onchange="updateMed(${i},'note',this.value)" placeholder="1-0-1"></td>
      <td><button class="btn-remove" onclick="removeMed(${i})">✕</button></td>
    </tr>`).join('');
}

function addMedRow() {
  const p=patients.find(x=>x.id===currentPatientId);
  if(!p.currentVisit) p.currentVisit={meds:[]};
  p.currentVisit.meds.push({name:'',dose:'',times:'',days:'',note:''});
  save(p); renderMedRows();
}
function updateMed(i,field,val) {
  const p=patients.find(x=>x.id===currentPatientId);
  if(p.currentVisit&&p.currentVisit.meds[i]) { p.currentVisit.meds[i][field]=val; save(p); }
}
function removeMed(i) {
  const p=patients.find(x=>x.id===currentPatientId);
  p.currentVisit.meds.splice(i,1); save(p); renderMedRows();
}

// ============ SAVE VISIT ============
function saveVisit() {
  const p=patients.find(x=>x.id===currentPatientId); if(!p) return;
  const visit={
    id: Date.now(),
    date: document.getElementById('v_date').value,
    type: document.getElementById('v_type').value,
    pulse: document.getElementById('v_pulse').value,
    bp: document.getElementById('v_bp').value,
    reason: document.getElementById('v_reason').value,
    diag: document.getElementById('v_diag').value,
    meds: p.currentVisit&&p.currentVisit.meds ? [...p.currentVisit.meds] : [],
    nextVisit: document.getElementById('v_next').value,
    nextVisitTime: document.getElementById('v_nextTime').value,
    note: document.getElementById('v_note').value,
  };
  if(!visit.date||!visit.diag) { showToast('Vui lòng điền Ngày khám và Chẩn đoán','error'); return; }
  if(!p.visits) p.visits=[];
  p.visits.push(visit);
  p.nextVisit=visit.nextVisit;
  p.nextVisitTime=visit.nextVisitTime;
  p.currentVisit={meds:[]};
  save(p);
  showToast('✓ Đã lưu & đồng bộ Firebase!','success');
  setTimeout(()=>renderDetail(), 400);
}

function clearCurrentVisit() {
  const p=patients.find(x=>x.id===currentPatientId); if(!p) return;
  if(!confirm('Xóa toàn bộ thông tin đang nhập?')) return;
  p.currentVisit={meds:[]}; save(p); renderTab();
}

// ============ NEW PATIENT ============
function openNewPatient() {
  ['np_name','np_year','np_phone','np_address','np_history'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('modalNewPatient').classList.add('show');
  setTimeout(()=>document.getElementById('np_name').focus(),100);
}

async function saveNewPatient() {
  const name=document.getElementById('np_name').value.trim();
  if(!name){showToast('Vui lòng nhập họ tên','error');return;}
  const p={
    id:'bn_'+Date.now(),
    name, year:document.getElementById('np_year').value,
    gender:document.getElementById('np_gender').value,
    phone:document.getElementById('np_phone').value,
    address:document.getElementById('np_address').value,
    history:document.getElementById('np_history').value,
    visits:[], currentVisit:{meds:[]},
    createdAt:new Date().toISOString(),
  };
  patients.unshift(p);
  save(p);
  closeModal('modalNewPatient');
  renderPatientList();
  selectPatient(p.id);
  showToast('✓ Đã thêm bệnh nhân & đồng bộ Firebase','success');
}

async function deletePatient(id) {
  if(!confirm('Xóa bệnh nhân này? Dữ liệu sẽ xóa khỏi Firebase!')) return;
  patients=patients.filter(p=>p.id!==id);
  fbDeletePatient(id);
  saveLocal();
  currentPatientId=null;
  renderPatientList();
  updateWelcome();
}

// ============ QR CODE ============
function generateQR() {
  const p=patients.find(x=>x.id===currentPatientId); if(!p) return;
  const lastVisit=p.visits&&p.visits.length>0?p.visits[p.visits.length-1]:null;
  const payload=JSON.stringify({
    name:p.name, gender:p.gender, year:p.year,
    diag:lastVisit?lastVisit.diag:'',
    pulse:lastVisit?lastVisit.pulse:'', bp:lastVisit?lastVisit.bp:'',
    date:lastVisit?lastVisit.date:'', type:lastVisit?lastVisit.type:'',
    meds:lastVisit?lastVisit.meds:[],
    nextVisit:p.nextVisit, nextVisitTime:p.nextVisitTime,
    note:lastVisit?lastVisit.note:'',
    clinic:'Phòng khám Bác sĩ Nam'
  });
  const baseUrl='https://phongkham-bacsinam.vercel.app/don-thuoc.html';
  const qrUrl=baseUrl+'?d='+encodeURIComponent(payload);

  document.getElementById('qrInfo').innerHTML=`
    <strong>Bệnh nhân:</strong> ${p.name}<br>
    <strong>Chẩn đoán:</strong> ${lastVisit?lastVisit.diag:'Chưa có'}<br>
    <strong>Số thuốc:</strong> ${lastVisit&&lastVisit.meds?lastVisit.meds.length:0} loại<br>
    <strong>Tái khám:</strong> ${p.nextVisit||'Chưa hẹn'}${p.nextVisitTime?' lúc '+p.nextVisitTime:''}`;

  const qrDiv=document.getElementById('qrcode'); qrDiv.innerHTML='';
  new QRCode(qrDiv,{text:qrUrl,width:200,height:200,colorDark:'#0d1117',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  document.getElementById('modalQR').classList.add('show');
}

function printQR() {
  const p=patients.find(x=>x.id===currentPatientId);
  const lastVisit=p&&p.visits&&p.visits.length>0?p.visits[p.visits.length-1]:null;
  const qrCanvas=document.querySelector('#qrcode canvas'); if(!qrCanvas) return;
  const win=window.open('','_blank');
  win.document.write(`<html><head><title>QR - ${p.name}</title>
    <style>body{font-family:sans-serif;text-align:center;padding:40px}h2{margin-bottom:4px}p{color:#666;margin:4px 0}.info{border:1px solid #ddd;border-radius:8px;padding:16px;max-width:300px;margin:20px auto;text-align:left;font-size:14px;line-height:2}</style></head>
    <body><h2>Đơn thuốc điện tử</h2><p>Quét mã QR để xem đơn thuốc & nhận nhắc nhở</p>
    <img src="${qrCanvas.toDataURL()}" width="200" height="200">
    <div class="info"><strong>Bệnh nhân:</strong> ${p.name}<br><strong>Chẩn đoán:</strong> ${lastVisit?lastVisit.diag:'N/A'}<br><strong>Tái khám:</strong> ${p.nextVisit||'Chưa hẹn'}</div>
    </body></html>`);
  win.document.close(); win.print();
}

// ============ TOAST ============
function showToast(msg,type='success') {
  const t=document.createElement('div');
  t.className=`toast ${type}`; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// ============ UTILS ============
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('show');});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('show'));
  if(e.key==='n'&&(e.ctrlKey||e.metaKey)){e.preventDefault();openNewPatient();}
});

// ============ START ============
init();
</script>
</body>
</html>
